<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ÂLÂ Chat Test</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#f5ead5;font-family:Arial,sans-serif}.wrap{max-width:680px;margin:auto;min-height:100vh;padding:24px 18px}.brand{text-align:center;color:#e6b85f;font-size:34px;font-weight:800;letter-spacing:5px}.sub{text-align:center;color:#a99982;margin:8px 0 20px}.status{border:1px solid #5b4526;border-radius:14px;padding:12px;margin-bottom:14px}.ok{color:#7ee787}.bad{color:#ff8b8b}.msgs{height:56vh;overflow:auto;border:1px solid #30271d;border-radius:18px;padding:12px;background:#0b0908}.m{background:#1b1714;border-radius:16px;padding:12px;margin:10px 0}.who{font-size:12px;color:#e6b85f;font-weight:700;margin-bottom:7px}.row{display:flex;gap:10px;margin-top:14px}input{flex:1;background:#080706;color:white;border:1px solid #6b512a;border-radius:16px;padding:16px;font-size:18px}button{width:72px;border:0;border-radius:16px;background:#e7b85d;color:#111;font-size:27px;font-weight:bold}.switch{display:flex;gap:8px;margin-bottom:14px}.switch button{width:auto;flex:1;font-size:15px;padding:12px}.active{outline:2px solid #fff}</style></head><body><div class="wrap"><div class="brand">ÂLÂ</div><div class="sub">HTTPS CHAT TEST • 11 EYLÜL</div><div class="switch"><button id="ev" onclick="setPartner('Evren')">Evren</button><button id="ga" onclick="setPartner('Gamze')">Gamze</button></div><div id="status" class="status">Firebase bağlanıyor…</div><div id="msgs" class="msgs"></div><div class="row"><input id="msg" placeholder="Mesaj yaz…" autocomplete="off"><button id="send" type="button">➤</button></div></div><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
import {getFirestore,collection,addDoc,onSnapshot,query,orderBy,limit} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyB3gFiLfA3naEP4Lx5fNt7o5oUwXQSUM1c',authDomain:'paira-468c3.firebaseapp.com',projectId:'paira-468c3',storageBucket:'paira-468c3.firebasestorage.app'};
const app=initializeApp(firebaseConfig), db=getFirestore(app); const room=collection(db,'chatRooms','general__main','messages');
let partner=new URLSearchParams(location.search).get('partner')||localStorage.getItem('ala_test_partner')||'Evren'; const couple='Evren & Gamze';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.setPartner=(p)=>{partner=p;localStorage.setItem('ala_test_partner',p);paintPartner()};
function paintPartner(){document.getElementById('ev').classList.toggle('active',partner==='Evren');document.getElementById('ga').classList.toggle('active',partner==='Gamze')}; paintPartner();
const status=document.getElementById('status'), box=document.getElementById('msgs'), input=document.getElementById('msg'), send=document.getElementById('send');
const q=query(room,orderBy('clientAt','asc'),limit(250));
onSnapshot(q,s=>{status.className='status ok';status.textContent='✓ Firebase canlı bağlantı kuruldu';box.innerHTML=s.docs.map(d=>{const m=d.data();return `<div class="m"><div class="who">${esc(m.partnerName)} • ${esc(m.coupleName)}</div><div>${esc(m.text)}</div></div>`}).join('');box.scrollTop=box.scrollHeight},e=>{status.className='status bad';status.textContent='Bağlantı hatası: '+(e.code||e.message)});
async function go(){const text=input.value.trim();if(!text)return;send.disabled=true;status.textContent='Gönderiliyor…';try{await addDoc(room,{partnerName:partner,coupleName:couple,partnerIndex:partner==='Gamze'?1:0,text,deviceId:'https-test',clientAt:Date.now()});input.value='';status.className='status ok';status.textContent='✓ Mesaj Firebase’e gönderildi'}catch(e){status.className='status bad';status.textContent='Gönderme hatası: '+(e.code||e.message)}finally{send.disabled=false;input.focus()}}
send.addEventListener('click',go);input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}});
</script></body></html>
