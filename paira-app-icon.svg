      <stop offset="0" stop-color="#17120d"/>
      <stop offset="1" stop-color="#050403"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d99a"/>
      <stop offset="0.45" stop-color="#c98d3a"/>
      <stop offset="0.75" stop-color="#f0c879"/>
