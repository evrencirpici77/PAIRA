name: Apply ÂLÂ step1 now
on:
  push:
    branches: [ala-final-gorsel-deneme]
    paths: ['.github/workflows/ala-step1-lock-v2.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ala-final-gorsel-deneme
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          tag='<script src="/ala-step1-livegold.js?v=1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Activate ÂLÂ visual step 1"
          git push
