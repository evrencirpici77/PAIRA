name: Add phone install button

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-install-button.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- ALA INSTALL HELPER START -->'
          if marker in s:
              print('Install helper already present')
              raise SystemExit(0)
          inject=r'''
          <!-- ALA INSTALL HELPER START -->
          <style id="ala-install-style">
          #alaInstallFab{position:fixed;right:16px;bottom:88px;z-index:2147483000;border:1px solid rgba(231,189,114,.48);background:linear-gradient(135deg,#f1d790,#c89a45);color:#17120a;border-radius:999px;padding:12px 16px;font:800 14px/1.1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.35);display:none;align-items:center;gap:8px}#alaInstallFab.show{display:flex}#alaInstallOverlay{position:fixed;inset:0;z-index:2147483001;background:rgba(0,0,0,.78);display:none;align-items:flex-end;justify-content:center;padding:16px}#alaInstallOverlay.show{display:flex}#alaInstallCard{width:min(460px,100%);background:#111;border:1px solid rgba(231,189,114,.34);border-radius:24px;padding:20px;color:#fff;box-shadow:0 20px 70px rgba(0,0,0,.65);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#alaInstallCard h3{margin:0 0 7px;color:#e7bd72;font-size:22px}#alaInstallCard p{margin:0 0 14px;color:#cfcfcf;line-height:1.45;font-size:14px}.alaInstallBtn{width:100%;border:0;border-radius:15px;padding:14px 16px;margin-top:10px;font-weight:800;font-size:16px}.alaInstallPrimary{background:linear-gradient(135deg,#f1d790,#c89a45);color:#17120a}.alaInstallSecondary{background:#242424;color:#fff;border:1px solid rgba(255,255,255,.12)}.alaInstallSteps{background:#191919;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:13px 15px;margin-top:12px;color:#e8e8e8;line-height:1.55;font-size:14px}
          </style>
          <button id="alaInstallFab" type="button" aria-label="Telefonuna kur">📲 Telefonuna Kur</button>
          <div id="alaInstallOverlay" aria-hidden="true"><div id="alaInstallCard" role="dialog" aria-modal="true"><h3>Telefonuna Kur</h3><p>ÂLÂ'yı ana ekranına ekle. Sonraki girişlerde WhatsApp davet linkini aramana gerek kalmaz.</p><div id="alaInstallDynamic"></div><button class="alaInstallBtn alaInstallSecondary" id="alaInstallClose" type="button">Şimdilik Kapat</button></div></div>
          <script>
          (function(){var fab=document.getElementById('alaInstallFab'),overlay=document.getElementById('alaInstallOverlay'),dynamic=document.getElementById('alaInstallDynamic'),close=document.getElementById('alaInstallClose'),deferredPrompt=null;function standalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}function ios(){return /iphone|ipad|ipod/i.test(navigator.userAgent)}function android(){return /android/i.test(navigator.userAgent)}function render(){if(standalone()){fab.classList.remove('show');return}fab.classList.add('show');if(ios()){dynamic.innerHTML='<div class="alaInstallSteps"><b>iPhone:</b><br>1. Bu sayfayı Safari ile aç.<br>2. Alttaki <b>Paylaş</b> simgesine dokun.<br>3. <b>Ana Ekrana Ekle</b> seçeneğini seç.<br>4. Sağ üstten <b>Ekle</b> de.</div>'}else if(android()){dynamic.innerHTML='<button class="alaInstallBtn alaInstallPrimary" id="alaDoInstall" type="button">🤖 Android’e Kur</button><div class="alaInstallSteps">Kur düğmesi açılmazsa Chrome sağ üst <b>⋮</b> menüsünden <b>Uygulamayı yükle</b> veya <b>Ana ekrana ekle</b> seçeneğini kullan.</div>';setTimeout(function(){var b=document.getElementById('alaDoInstall');if(b)b.onclick=doInstall},0)}else{dynamic.innerHTML='<div class="alaInstallSteps">Tarayıcı menüsünden <b>Ana ekrana ekle</b> veya <b>Uygulamayı yükle</b> seçeneğini kullan.</div>'}}async function doInstall(){if(deferredPrompt){deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(e){}deferredPrompt=null;overlay.classList.remove('show')}else{dynamic.insertAdjacentHTML('beforeend','<div class="alaInstallSteps">Chrome sağ üst <b>⋮</b> menüsünden <b>Uygulamayı yükle</b> veya <b>Ana ekrana ekle</b> seçeneğine dokun.</div>')}}window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;render()});window.addEventListener('appinstalled',function(){fab.classList.remove('show');overlay.classList.remove('show')});fab.addEventListener('click',function(){render();overlay.classList.add('show')});close.addEventListener('click',function(){overlay.classList.remove('show')});overlay.addEventListener('click',function(e){if(e.target===overlay)close.click()});if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',render);else render()})();
          </script>
          <!-- ALA INSTALL HELPER END -->
          '''
          if '</body>' not in s.lower():
              raise SystemExit('No </body> found')
          pos=s.lower().rfind('</body>')
          s=s[:pos]+inject+'\n'+s[pos:]
          p.write_text(s,encoding='utf-8')
          print('Install helper added')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add phone install button"
          git push origin HEAD:main
