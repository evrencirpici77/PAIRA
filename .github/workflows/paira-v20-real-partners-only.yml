name: PAIRA v20 real partners only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paira-v20-real-partners-only.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove demo partner businesses
        shell: bash
        run: |
          python -c "import base64;exec(base64.b64decode(''))"

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "PAIRA Hotfix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Remove demo partner businesses"
          git push
