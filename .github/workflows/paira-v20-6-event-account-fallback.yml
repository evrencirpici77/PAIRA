name: PAIRA v20.6 event account fallback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paira-v20-6-event-account-fallback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python tools/event_patch_v20_6.py
      - name: Commit patched app
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use shared couple fallback for event attendance"
          git push
