name: PAIRA v19.2 Firestore meta id hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paira-v19-2-meta-hotfix.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          text = text.replace(
              '<meta name="paira-build" content="v19.1-event-save-fix">',
              '<meta name="paira-build" content="v19.2-firestore-meta-fix">',
              1,
          )

          # Firestore document IDs cannot match __.*__. The previous __meta__
          # marker therefore caused Firebase INVALID_ARGUMENT during event save.
          text = text.replace("'__meta__'", "'_meta'")
          text = text.replace('"__meta__"', '"_meta"')

          if text == original:
              print('No changes needed; hotfix may already be applied.')
          else:
              path.write_text(text, encoding='utf-8')
              print('PAIRA v19.2 Firestore meta id hotfix applied.')

      - name: Commit hotfix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes to commit."
            exit 0
          fi
          git config user.name "PAIRA Hotfix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Firestore event meta document id"
          git push
