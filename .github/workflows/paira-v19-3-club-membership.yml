name: PAIRA v19.3 club membership sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paira-v19-3-club-membership.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          text = text.replace(
              '<meta name="paira-build" content="v19.2-firestore-meta-fix">',
              '<meta name="paira-build" content="v19.3-club-membership-sync">',
              1,
          )

          old = r'''function renderClubs(){
  document.getElementById('clubsList').innerHTML = Object.entries(clubs).map(([key,c])=>{
    const count = (state.clubMembers[key] || []).length;
    return `<button class="listbtn" onclick="openClub('${key}')"><div class="club-top"><div><b>${c.title}</b><div class="muted" style="margin-top:4px">${c.desc}</div></div><span class="club-badge">${count} üye</span></div></button>`;
  }).join('');
}
function openClub(key){ currentClub = key; renderClubDetail(); show('clubDetail'); }
function renderClubDetail(){
  const c = clubs[currentClub];
  const me=currentChatIdentity();
  const members = state.clubMembers[currentClub] || [];
  const joined = members.includes(me.coupleName) || members.includes(currentUser);
  const actionButtons = joined
    ? `<button class="gold" style="opacity:.75">Kulübe Katıldın ✓</button><button class="out" style="margin-top:10px;border-color:#b96060;color:#ffb2ac" onclick="leaveClub('${currentClub}')">Kulüpten Ayrıl</button>`
    : `<button class="gold" onclick="joinClub('${currentClub}')">Kulübe Katıl</button>`;
  document.getElementById('clubDetailWrap').innerHTML = `
