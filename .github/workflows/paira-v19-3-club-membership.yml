          new = r'''const clubMembershipUnsubs = new Map();

function clubMembershipEventId(key){
  return `club_${String(key || '').replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,70)}`;
}

function isCurrentCoupleInClub(key){
  const me = currentChatIdentity();
  const members = state.clubMembers[key] || [];
  return members.includes(me.coupleName) || members.includes(currentUser);
}

function applyClubMembership(key, remote){
  const me = currentChatIdentity();
  state.clubMembers[key] = state.clubMembers[key] || [];
  state.clubMembers[key] = state.clubMembers[key].filter(n => n !== currentUser && n !== me.coupleName);
  if(remote && remote.joined === true) state.clubMembers[key].push(me.coupleName);
  persist();
  renderClubs();
  if(currentClub === key){
    const active = document.querySelector('.screen.active');
    if(active && active.id === 'clubDetail') renderClubDetail();
  }
}

async function ensureClubMembershipSync(key){
  const accountId = sharedProfileAccountId();
  if(!key || !accountId || clubMembershipUnsubs.has(key)) return;
  try{
    const api = await waitForPairaFirebaseApi();
    const eventId = clubMembershipEventId(key);
    const existing = await api.getEventAttendance(eventId, accountId);
    applyClubMembership(key, existing);
    const unsub = api.subscribeEventAttendance(eventId, accountId, row=>{
      applyClubMembership(key, row);
    }, err=>{
      console.warn('PAIRA club membership sync', key, err);
      clubMembershipUnsubs.delete(key);
    });
    clubMembershipUnsubs.set(key, unsub);
  }catch(err){
    console.warn('PAIRA club membership start', key, err);
  }
}

function ensureAllClubMembershipSync(){
  Object.keys(clubs || {}).forEach(key=>ensureClubMembershipSync(key));
}

async function setSharedClubMembership(key, joined){
  const accountId = sharedProfileAccountId();
  const me = currentChatIdentity();
  const wasJoined = isCurrentCoupleInClub(key);

  applyClubMembership(key, joined ? {joined:true} : {joined:false});

  if(!accountId){
    toast(joined ? 'Kulübe katıldın ✓' : 'Kulüpten ayrıldın');
    return true;
  }

  try{
    const api = await waitForPairaFirebaseApi();
    await api.setEventAttendance(clubMembershipEventId(key), accountId, {
      joined,
      inviteCode:accountId,
      coupleName:me.coupleName,
      partnerName:me.partnerName,
      deviceId:getDeviceId()
    });
    toast(joined ? 'Çift olarak kulübe katıldınız ✓' : 'Çift olarak kulüpten ayrıldınız');
    return true;
  }catch(err){
    console.warn('PAIRA club membership save', err);
    applyClubMembership(key, wasJoined ? {joined:true} : {joined:false});
    toast('Kulüp üyeliği kaydedilemedi');
    return false;
  }
}

function renderClubs(){
  document.getElementById('clubsList').innerHTML = Object.entries(clubs).map(([key,c])=>{
    const count = (state.clubMembers[key] || []).length;
    return `<button class="listbtn" onclick="openClub('${key}')"><div class="club-top"><div><b>${c.title}</b><div class="muted" style="margin-top:4px">${c.desc}</div></div><span class="club-badge">${count} üye</span></div></button>`;
  }).join('');
}
function openClub(key){
  currentClub = key;
  renderClubDetail();
  show('clubDetail');
  ensureClubMembershipSync(key);
}
function renderClubDetail(){
  const c = clubs[currentClub];
  const me=currentChatIdentity();
  const members = state.clubMembers[currentClub] || [];
  const joined = isCurrentCoupleInClub(currentClub);
  const actionButtons = joined
    ? `<button class="gold" style="opacity:.75">Kulübe Katıldın ✓</button><button class="out" style="margin-top:10px;border-color:#b96060;color:#ffb2ac" onclick="leaveClub('${currentClub}')">Kulüpten Ayrıl</button>`
    : `<button class="gold" onclick="joinClub('${currentClub}')">Kulübe Katıl</button>`;
  document.getElementById('clubDetailWrap').innerHTML = `
    <div class="card"><h2>${c.title}</h2><p class="muted">${c.desc}</p><div class="row" style="justify-content:space-between;flex-wrap:wrap"><span class="badge">${members.length} üye</span><span class="badge">Kalıcı üyelik</span></div></div>
    ${actionButtons}
    <div class="section-title">Üye Listesi</div>
    <div class="members-pills">${members.map(n=>`<span class="member-pill">${escapeHtml(n)}</span>`).join('') || '<span class="muted">Henüz üye yok</span>'}</div>
    <div class="section-title">Kulüp Chat Odası</div>
    <div class="muted" style="font-size:12px;margin-bottom:8px">Bu telefonda yazan: ${escapeHtml(me.partnerName)} • ${escapeHtml(me.coupleName)}</div>
    <div id="clubMsgs"><div class="muted" style="padding:12px 2px">Sohbet yükleniyor...</div></div>
    <div class="composer"><input id="clubInput" placeholder="Kulüp odasına mesaj yaz..."><button class="gold" style="width:64px" onclick="sendClubMessage()">➤</button></div>`;
  startRealtimeChat('club',currentClub,'clubMsgs');
}
function joinClub(key){ return setSharedClubMembership(key, true); }
function leaveClub(key){ return setSharedClubMembership(key, false); }
async function sendClubMessage(){
  if(!isCurrentCoupleInClub(currentClub)){
    const ok = await setSharedClubMembership(currentClub, true);
    if(!ok) return;
  }
  return sendRealtimeRoomMessage('club',currentClub,'clubInput');
}'''

          if old not in text:
              raise SystemExit('Expected club block not found; refusing partial patch')
          text = text.replace(old, new, 1)

          startup_old = '''renderAdminEvents();\nrenderClubs();\nrenderAdminInbox();'''
          startup_new = '''renderAdminEvents();\nrenderClubs();\nensureAllClubMembershipSync();\nrenderAdminInbox();'''
          if startup_old not in text:
              raise SystemExit('Startup anchor not found; refusing partial patch')
          text = text.replace(startup_old, startup_new, 1)

          if text == original:
              raise SystemExit('No changes made')
          path.write_text(text, encoding='utf-8')
          print('PAIRA v19.3 club membership sync applied.')

      - name: Commit sync
        shell: bash
        run: |
          git config user.name "PAIRA Hotfix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Sync club membership across partners"
          git push
