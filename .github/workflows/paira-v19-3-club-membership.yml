name: PAIRA v19.3 club membership sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paira-v19-3-club-membership.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html
        shell: python
        run: |
          import base64
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text
          text = text.replace('<meta name="paira-build" content="v19.2-firestore-meta-fix">','<meta name="paira-build" content="v19.3-club-membership-sync">',1)
          old = base64.b64decode('').decode('utf-8')
          new = base64.b64decode('').decode('utf-8')
          if old not in text:
              raise SystemExit('Expected club block not found; refusing partial patch')
          text = text.replace(old, new, 1)
          startup_old = "renderAdminEvents();\nrenderClubs();\nrenderAdminInbox();"
          startup_new = "renderAdminEvents();\nrenderClubs();\nensureAllClubMembershipSync();\nrenderAdminInbox();"
          if startup_old not in text:
              raise SystemExit('Startup anchor not found; refusing partial patch')
          text = text.replace(startup_old, startup_new, 1)
          if text == original:
              raise SystemExit('No changes made')
          path.write_text(text, encoding='utf-8')
          print('PAIRA v19.3 club membership sync applied.')

      - name: Commit sync
        shell: bash
        run: |
          git config user.name "PAIRA Hotfix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Sync club membership across partners"
          git push
