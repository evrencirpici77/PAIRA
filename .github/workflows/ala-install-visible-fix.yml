name: Make install button visible

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ala-install-visible-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix install button visibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="alaInstallFab"' not in s:
              raise SystemExit('Install button not found')
          replacement = '#alaInstallFab{position:fixed;left:50%;right:auto;bottom:92px;transform:translateX(-50%);z-index:2147483000;border:1px solid rgba(231,189,114,.58);background:linear-gradient(135deg,#f1d790,#c89a45);color:#17120a;border-radius:999px;padding:13px 19px;font:800 14px/1.1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.48);display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;min-width:176px}'
          s, n = re.subn(r'#alaInstallFab\{[^}]*\}', replacement, s, count=1)
          if n != 1:
              raise SystemExit('Install button style not replaced')
          old = "function render(){if(standalone()){fab.classList.remove('show');return}fab.classList.add('show');"
          new = "function render(){fab.classList.add('show');"
          if old in s:
              s=s.replace(old,new,1)
          # Add an inline click fallback in case another script on the page throws.
          s=s.replace('<button id="alaInstallFab" type="button" aria-label="Telefonuna kur">', '<button id="alaInstallFab" type="button" aria-label="Telefonuna kur" onclick="var x=document.getElementById(\'alaInstallOverlay\');if(x)x.classList.add(\'show\')">', 1)
          p.write_text(s,encoding='utf-8')
          print('Install button visibility fixed')
          PY
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix visible phone install button"
          git push origin HEAD:main
