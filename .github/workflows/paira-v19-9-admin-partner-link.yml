name: PAIRA v19.9 admin partner link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paira-v19-9-admin-partner-link.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix partner business admin link
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "onclick=\"pairaRequireAdmin('adminPartners')\""
          new = "onclick=\"show('adminPartners');renderPartnerAdmin()\""
          if old not in s:
              raise SystemExit('adminPartners link pattern not found')
          s = s.replace(old, new, 1)
          s = s.replace('v19.8-partner-businesses-qr', 'v19.9-admin-partner-link', 1)
          p.write_text(s, encoding='utf-8')
          print('admin partner link fixed')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "PAIRA Hotfix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix partner business admin link"
          git push
