name: PAIRA v20.1 partner read fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paira-v20-1-partner-read-fix.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch partner business loading
        shell: bash
        run: |
          python -c "import base64;exec(base64.b64decode(''))"

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "PAIRA Hotfix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix partner business list loading"
          git push
