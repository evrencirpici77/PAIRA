name: ALA member brand layer

on:
  push:
    paths:
      - '.github/workflows/ala-member-brand-layer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inject isolated member branding script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script defer src="/ala-member-brand.js?v=1"></script>'
          if tag in s:
              print('Brand layer already injected')
          else:
              anchor = '</body>'
              if anchor not in s:
                  raise SystemExit('Closing body tag not found')
              s = s.replace(anchor, tag + '\n' + anchor, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Safety checks
        run: |
          test -f ala-member-brand.js
          grep -q 'ala-member-brand.js?v=1' index.html
          grep -q 'paira-build' index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('ala-member-brand.js?v=1') == 1
          assert '<meta name="paira-build" content="v20.3-home-icon">' in s
          print('Stable v20.3 marker preserved and ALA layer injected once.')
          PY

      - name: Commit isolated branding injection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index change needed"
          else
            git commit -m "Show ALA branding to members without changing app logic"
            git push origin main
          fi
